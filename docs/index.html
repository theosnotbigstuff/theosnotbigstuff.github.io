<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>theosnotbigstuff</title>
  <link rel="shortcut icon" type="image/x-icon" href="https://github.com/theosnotbigstuff/theosnotbigstuff.github.io/raw/refs/heads/main/docs/favicon.ico">
  
  <!-- Preconnect and Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
   @font-face {
      font-family: 'Kumbh Sans';
      src: url('https://github.com/theosnotbigstuff/theosnotbigstuff.github.io/raw/refs/heads/main/docs/font.ttf') format('truetype');
    }

    /* Base Layout Rules */
    body {
      margin: 0;
      padding-top: 50px;
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Kumbh Sans', sans-serif;
    }

    /* Navigation Layout */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
    }

    .topnav::after {
      content: "";
      display: table;
      clear: both;
    }

    .topnav a, 
    .dropdown {
      float: left;
      position: relative;
    }

    .topnav a {
      display: block;
      margin-right: 5px;
      padding: 8px 12px;
      border-radius: 6px;
      color: #b0b0b0;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s, transform 0.1s ease-out;
    }

    .topnav a:hover, 
    .dropdown:hover .dropbtn {
      background-color: #333333;
      color: #ffffff;
    }

    .topnav a.active {
      background-color: #000000;
      color: #ffffff;
    }

    .topnav a:active {
      transform: scale(0.92);
    }

    /* Navigation Action Buttons */
    .topnav a.donate-btn {
      display: inline-flex;
      align-items: center;
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 600;
    }

    .topnav a.donate-btn:hover {
      background-color: #0051b3;
      color: #ffffff;
    }

    .donate-icon {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      object-fit: contain;
    }

    /* Dropdown UI System */
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 1001;
      padding-top: 8px;
      min-width: 160px;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-menu {
      overflow: hidden;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background-color: #1e1e1e;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
    }

    .dropdown-menu a {
      float: none;
      display: block;
      margin-right: 0;
      padding: 10px 14px;
      border-radius: 0;
      text-align: left;
    }

    .dropdown-menu a:hover {
      background-color: #2a2a2a;
      color: #ffffff;
    }

    /* Content Layout Elements */
    .main-container {
      padding-left: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Main Navigation Bar -->
  <nav class="topnav">

    <!-- Socials Dropdown -->
    <div class="dropdown">

          <a href="https://youtube.com/@theosnotbigstuff" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px;"> 
            <img src="https://raw.githubusercontent.com/theosnotbigstuff/theosnotbigstuff.github.io/refs/heads/main/docs/linkicons/youtube.png" alt="" width="20" height="20"> YouTube
          </a> 
          <a href="https://x.com/@theosnotbigstuf" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px;"> 
            <img src="https://raw.githubusercontent.com/theosnotbigstuff/theosnotbigstuff.github.io/refs/heads/main/docs/linkicons/twitter.png" alt="" width="20" height="20"> Twitter
          </a> 
          <a href="https://tiktok.com/@theosnotbigstuff" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px;"> 
            <img src="https://theosnotbigstuff.neocities.org/linkicons/tiktok.png" alt="" class="donate-icon" width="20" height="20" style="transform: scale(1.3); margin-left: 2px;"> TikTok
          </a> 
          <a href="https://www.instagram.com/theosnotbigstuff/" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px;"> 
            <img src="https://theosnotbigstuff.neocities.org/linkicons/instagram.png" alt="" width="20" height="20"> Instagram
          </a> 
        </div> 
      </div> 
    </div>

    <!-- Projects Dropdown -->
    <div class="dropdown">
      <a class="dropbtn" href="#">Projects</a>

          <a href="https://github.com/theosnotbigstuff?tab=repositories" target="_blank" rel="noopener noreferrer">All Repositories</a>

          <a href="https://youtube.com/@aznlarpmp4">aznlarp.mp4</a>
        </div>
      </div>
    </div>
    
    <!-- Donate Button -->
    <a class="donate-btn" href="https://www.paypal.com/paypalme/TheoJames2" target="_blank" rel="noopener noreferrer">

      Donate
    </a>
  </nav>

  <!-- Main Site Body Content -->
  <main class="main-container">
    <h2>Welcome to my site!</h2>
    <p>this is where my links and projects are, feel free to check it out.</p>
  </main>

</body>
