<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>theosnotbigstuff</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Preconnect and Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
@font-face {
    font-family: 'Quicksand';
    src: url('https://theosnotbigstuff.neocities.org/fonts/font.ttf') format('truetype');
}
/* Base Layout Rules with Background Support */
  <link rel="stylesheet" href="style.css">

</style>
</head>
<body>

<!-- Main Site Body Content -->
<main class="main-container">
    <img src="https://theosnotbigstuff.neocities.org/linkicons/New%20Project%20(5).png" alt="logo" width="300" height="60">
</main>

<!-- Main Navigation Bar -->
<nav class="topnav">
<p> Socials </p>
    <!-- Socials Menu Dropdown Box -->
    <div class="dropdown">
     <div class="dropdown-menu">
                <!-- Custom Hex Colors applied individually using standard inline style tags -->
                <a href="https://youtube.com/@theosnotbigstuff" target="_blank" rel="noopener noreferrer" style="--btn-color: #ff0000;">
                    <img src="https://theosnotbigstuff.neocities.org/linkicons/youtube.png" alt="" width="20" height="20"> YouTube
                </a>
                <a href="https://x.com/@theosnotbigstuf" target="_blank" rel="noopener noreferrer" style="--btn-color: #1da1f2;">
                    <img src="https://theosnotbigstuff.neocities.org/linkicons/twitter.png" alt="" width="20" height="20"> Twitter
                </a>
                <a href="https://tiktok.com/@theosnotbigstuff" target="_blank" rel="noopener noreferrer" style="--btn-color: #010101;">
                    <img src="https://theosnotbigstuff.neocities.org/linkicons/tiktok.png" alt="" class="donate-icon" width="20" height="20" style="transform: scale(1.3); margin-left: 2px;"> TikTok
                </a>
                <a href="https://www.instagram.com/theosnotbigstuff/" target="_blank" rel="noopener noreferrer" style="--btn-color: #e1306c;">
                    <img src="https://theosnotbigstuff.neocities.org/linkicons/instagram.png" alt="" width="20" height="20"> Instagram
                </a>
                
            </div>
        </div>
    </div>

   
    <p> Dontate </p>
    <!-- Donate Button -->
    <a class="donate-btn" href="https://paypal.me/TheoJames2" target="_blank" rel="noopener noreferrer" style="--btn-color: #0070f3;">
        <img src="https://theosnotbigstuff.neocities.org/linkicons/new-PayPal-icon-white-png-large-size.png" alt="Donate" class="donate-icon"> PayPal
    </a>
</nav>

<!-- JavaScript to handle safe multi-dropdown clicking -->
<script>
document.querySelectorAll('.dropbtn').forEach(button => {
    button.addEventListener('click', (e) => {
        e.preventDefault();
        const parent = button.parentElement;
        
        document.querySelectorAll('.dropdown').forEach(drop => {
            if (drop !== parent) drop.classList.remove('open');
        });
        
        parent.classList.toggle('open');
    });
});

window.addEventListener('click', (e) => {
    if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown').forEach(drop => {
            drop.classList.remove('open');
        });
    }
});
</script>

</body>
</html>
