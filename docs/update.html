  <style>
   @font-face {
      font-family: 'Quicksand';
      src: url('https://github.com/theosnotbigstuff/theosnotbigstuff.github.io/raw/refs/heads/main/docs/font.ttf') format('truetype');
    }

    /* Base Layout Rules */
    body {
      margin: 0;
      padding-top: 50px;
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Quicksand', sans-serif;
    }

    /* Navigation Layout */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
    }

    .topnav::after {
      content: "";
      display: table;
      clear: both;
    }

    .topnav a, 
    .dropdown {
      float: left;
      position: relative;
    }

    .topnav a {
      display: block;
      margin-right: 5px;
      padding: 8px 12px;
      border-radius: 6px;
      color: #b0b0b0;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s, transform 0.1s ease-out;
    }

    .topnav a:hover, 
    .dropdown:hover .dropbtn {
      background-color: #333333;
      color: #ffffff;
    }

    .topnav a.active {
      background-color: #000000;
      color: #ffffff;
    }

    .topnav a:active {
      transform: scale(0.92);
    }

    /* Navigation Action Buttons */
    .topnav a.donate-btn {
      display: inline-flex;
      align-items: center;
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 600;
    }

    .topnav a.donate-btn:hover {
      background-color: #0051b3;
      color: #ffffff;
    }

    .donate-icon {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      object-fit: contain;
    }

    /* Dropdown UI System */
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 1001;
      padding-top: 8px;
      min-width: 160px;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-menu {
      overflow: hidden;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background-color: #1e1e1e;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
    }

    .dropdown-menu a {
      float: none;
      display: block;
      margin-right: 0;
      padding: 10px 14px;
      border-radius: 0;
      text-align: left;
    }

    .dropdown-menu a:hover {
      background-color: #2a2a2a;
      color: #ffffff;
    }

    /* Content Layout Elements */
    .main-container {
      padding-left: 16px;
      text-align: center;
    }
  </style>
</head>
