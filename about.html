    <style>
    @import url('https://fonts.cdnfonts.com/css/lazy-meow');

body {
    font-family: 'Lazy Meow', sans-serif;
}

hr {
  width: 25%;       /* Adjust percentage to make it narrower or wider */
  margin: 20px auto; /* Centers the line and adds vertical spacing */
}

h2.lazy-subheading {
  font-family: 'Lazy Meow', sans-serif;
  font-size: 2.8rem;         /* Proportionate size for a subtitle */
  color: #000000;            /* Light color matching your H1 */
  font-weight: normal;
  margin-top: 15px;
}

/* Container for the link bar */
.link-bar {
  display: flex;
  justify-content: center; /* Centers the links horizontally */
  gap: 30px;               /* Spaces out the links */
  padding: 15px 0;
}

/* Individual links */
.link-bar a {
  font-family: 'Lazy Meow', sans-serif; /* Optional: matches your headings */
  font-size: 1.2rem;
  color: #000000;            /* Light color */
  text-decoration: none;     /* Removes the default underline */
  transition: opacity 0.2s ease;
}

/* Hover effect */
.link-bar a:hover {
  opacity: 0.7;              /* Fades slightly when hovered */
}

/* 1. Define the layout grid */
        .video-grid {
            display: grid;
            /* Creates columns that automatically wrap based on screen size (min 300px wide) */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* 2. Create a responsive wrapper for the 16:9 ratio */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Forces the container to stay in widescreen format */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 3. Make the iframe stretch perfectly to fill the wrapper */
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

</style>
